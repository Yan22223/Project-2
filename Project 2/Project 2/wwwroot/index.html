<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Store Analytics Dashboard</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
        }

        .card-title {
            color: #f8fafc;
        }

        .subtitle {
            color: #93c5fd;
            font-size: .9rem;
        }
        /* Make canvases responsive */
        .chart-container {
            position: relative;
            height: 320px;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-1">Music Store Analytics Dashboard</h1>
        <p class="subtitle mb-4">Pomona, CA – five data sources · five chart types · Bootstrap grid</p>

        <!-- ROW 1: 8/4 split -->
        <div class="row g-3">
            <div class="col-lg-8">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-2">Monthly Sales (Bar)</h5>
                        <div class="chart-container"><canvas id="barMonthlySales"></canvas></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-2">Revenue by Genre (Pie)</h5>
                        <div class="chart-container"><canvas id="pieGenreRevenue"></canvas></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ROW 2: 6/6 split -->
        <div class="row g-3 mt-1">
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-2">Daily Streams (Line)</h5>
                        <div class="chart-container"><canvas id="lineDailyStreams"></canvas></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-2">Orders by City (Doughnut)</h5>
                        <div class="chart-container"><canvas id="doughnutCityOrders"></canvas></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ROW 3: full width -->
        <div class="row g-3 mt-1">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-2">Price vs Rating (Scatter)</h5>
                        <div class="chart-container"><canvas id="scatterPriceRating"></canvas></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4 small text-secondary">
            Built with Bootstrap, Chart.js, and Papa Parse. Data are synthetic for course use.
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
  // Generic CSV -> rows helper (data getter approach)
  function getCSV(path) {
    return new Promise((resolve, reject) => {
      Papa.parse(path, {
        download: true,
        header: true,
        dynamicTyping: true,
        complete: (res) => resolve(res.data.filter(r => Object.keys(r).length>0)),
        error: (err) => reject(err)
      });
    });
  }

  // ----- Chart 1: Bar (monthly_sales.csv) -----
  getCSV('data/monthly_sales.csv').then(rows => {
    const labels = rows.map(r => r.Month);
    const values = rows.map(r => r.Sales);

    new Chart(document.getElementById('barMonthlySales'), {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Sales',
          data: values,
          borderWidth: 1
        }]
      },
      options: {
        responsive:true,
        scales: { y: { beginAtZero:true } }
      }
    });
  });

  // ----- Chart 2: Pie (genre_revenue.csv) -----
  getCSV('data/genre_revenue.csv').then(rows => {
    new Chart(document.getElementById('pieGenreRevenue'), {
      type: 'pie',
      data: {
        labels: rows.map(r => r.Genre),
        datasets: [{ data: rows.map(r => r.Revenue) }]
      },
      options: { responsive:true }
    });
  });

  // ----- Chart 3: Line (daily_streams.csv) -----
  getCSV('data/daily_streams.csv').then(rows => {
    new Chart(document.getElementById('lineDailyStreams'), {
      type: 'line',
      data: {
        labels: rows.map(r => r.Day),
        datasets: [{
          label: 'Streams',
          data: rows.map(r => r.Streams),
          fill: false,
          tension: 0.2
        }]
      },
      options: {
        responsive:true,
        scales: { y: { beginAtZero:false } }
      }
    });
  });

  // ----- Chart 4: Doughnut (city_orders.csv) -----
  getCSV('data/city_orders.csv').then(rows => {
    new Chart(document.getElementById('doughnutCityOrders'), {
      type: 'doughnut',
      data: {
        labels: rows.map(r => r.City),
        datasets: [{ data: rows.map(r => r.Orders) }]
      },
      options: { responsive:true }
    });
  });

  // ----- Chart 5: Scatter (price_vs_rating.csv) -----
  getCSV('data/price_vs_rating.csv').then(rows => {
    const points = rows.map(r => ({ x: r.Price, y: r.Rating }));
    new Chart(document.getElementById('scatterPriceRating'), {
      type: 'scatter',
      data: {
        datasets: [{
          label: 'Product',
          data: points,
          pointRadius: 3
        }]
      },
      options: {
        responsive:true,
        scales: {
          x: { title: { display:true, text:'Price ($)'} },
          y: { title: { display:true, text:'Rating (1–5)'}, min:1, max:5 }
        }
      }
    });
  });
    </script>
</body>
</html>
